name: Auto-Generate & Build 1xBet AI Auto-Bet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Generate Seluruh File Proyek 1xBet AI Sniper
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/onexbet/aisniper

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OneXBetAISniper"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.onexbet.aisniper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.onexbet.aisniper"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="1xBet AI Auto-Bet"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/onexbet/aisniper/MainActivity.kt
          package com.onexbet.aisniper

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.text.InputType
          import android.text.TextUtils
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.random.Random

          class MainActivity : Activity() {

              companion object {
                  const val PREFS_NAME = "onexbet_ai_sniper_prefs"
                  const val KEY_MIRROR_URL = "mirror_url"
                  const val KEY_MIN_CONFIDENCE = "min_confidence"
                  const val KEY_MIN_ODDS = "min_odds"
                  const val KEY_MAX_ODDS = "max_odds"
                  const val KEY_BASE_STAKE = "base_stake"
                  const val KEY_STAKE_MODE = "stake_mode" // 0=Flat, 1=Kelly AI Smart
                  const val KEY_STOP_LOSS = "stop_loss"
                  const val KEY_TAKE_PROFIT = "take_profit"
                  const val KEY_HUMAN_DELAY = "human_delay_ms"
                  const val KEY_GEMINI_API = "gemini_api_key"
                  const val KEY_CUSTOM_ODDS_SEL = "custom_odds_selector"
                  const val KEY_CUSTOM_STAKE_SEL = "custom_stake_selector"
                  const val KEY_CUSTOM_BETBTN_SEL = "custom_betbtn_selector"
                  const val KEY_BALANCE = "sim_balance"
              }

              data class ScrapedMatch(
                  val matchId: String,
                  val homeTeam: String,
                  val awayTeam: String,
                  val league: String,
                  val odd1: Double,
                  val oddX: Double,
                  val odd2: Double,
                  val domIndex1: Int,
                  val domIndexX: Int,
                  val domIndex2: Int
              )

              data class AIDecision(
                  val match: ScrapedMatch,
                  val pickLabel: String,
                  val marketCode: String, // "1", "X", "2"
                  val targetOdd: Double,
                  val targetDomIndex: Int,
                  val homeXG: Double,
                  val awayXG: Double,
                  val trueProbPercent: Int,
                  val impliedProbPercent: Int,
                  val valueEdgePercent: Double,
                  val confidenceScore: Int,
                  val recommendedStake: Long,
                  val reasoning: String
              )

              data classExecutedSlip(
                  val slipId: String,
                  val time: String,
                  val matchTitle: String,
                  val pick: String,
                  val odds: Double,
                  val stake: Long,
                  val potentialWin: Long,
                  val confidence: Int,
                  var status: String // "ACTIVE", "WIN", "LOSE"
              )

              private lateinit var prefs: SharedPreferences
              private val uiHandler = Handler(Looper.getMainLooper())
              private val aiExecutor = Executors.newSingleThreadExecutor()
              private var toneGen: ToneGenerator? = null
              private var vibrator: Vibrator? = null

              // State Konfigurasi
              private var mirrorUrl = "https://1xbet.com/id/live/football"
              private var minConfidence = 82
              private var minOdds = 1.50
              private var maxOdds = 3.60
              private var baseStake = 50000L
              private var stakeMode = 1 // 0=Flat, 1=Kelly Smart Stake
              private var stopLossLimit = 300000L
              private var takeProfitTarget = 500000L
              private var humanDelayMs = 2400L
              private var geminiApiKey = ""

              // Custom CSS Selectors (Multi-Fallback untuk DOM 1xBet)
              private var customOddsSelector = ".c-bets__bet, [data-market], .bet_type, .odd-btn"
              private var customStakeSelector = "input.cpn-bet__input, input[type='number'], .stake-input"
              private var customBetBtnSelector = ".cpn-btns__btn, .place-bet-btn, button.bet-submit"

              // Runtime State
              private var isAutopilotRunning = false
              private var isExecutingClickSequence = false
              private var isPanelMinimized = false
              private var activeBottomTab = "RADAR" // "RADAR", "SLIPS", "SETTINGS"

              private var currentBalance = 1500000L
              private var dailyNetProfit = 0L
              private val terminalLogs = mutableListOf<String>()
              private val executedSlips = mutableListOf<ExecutedSlip>()
              private val alreadyBetMatchIds = mutableSetOf<String>()
              private var latestAIDecision: AIDecision? = null

              // UI References
              private var webView: WebView? = null
              private var topStatusTv: TextView? = null
              private var balanceTv: TextView? = null
              private var profitTv: TextView? = null
              private var masterToggleBtn: TextView? = null
              private var bottomOverlayContainer: LinearLayout? = null
              private var dynamicTabContentContainer: FrameLayout? = null
              private var radarSummaryTv: TextView? = null
              private var terminalLogTv: TextView? = null

              // Loop Runnable Otomatis
              private val autopilotCycleRunnable = object : Runnable {
                  override fun run() {
                      if (!isAutopilotRunning) return

                      // Cek Pengaman Saldo (Stop-Loss & Take-Profit)
                      if (dailyNetProfit <= -stopLossLimit) {
                          appendLog("🛑 [STOP-LOSS] Batas rugi harian (-Rp ${formatRp(stopLossLimit)}) tercapai! AI Auto-Pilot dihentikan otomatis.")
                          stopAutopilot()
                          return
                      }
                      if (dailyNetProfit >= takeProfitTarget) {
                          appendLog("🎯 [TAKE-PROFIT] Target profit harian (+Rp ${formatRp(takeProfitTarget)}) tercapai! AI Auto-Pilot berhenti untuk mengamankan saldo.")
                          stopAutopilot()
                          return
                      }

                      if (!isExecutingClickSequence) {
                          triggerDOMScrapeOnWebView()
                      }

                      uiHandler.postDelayed(this, 6500L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  loadSettings()

                  try {
                      toneGen = ToneGenerator(AudioManager.STREAM_MUSIC, 80)
                  } catch (e: Exception) {
                      toneGen = null
                  }
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator

                  appendLog("[SYSTEM] 1xBet AI Autonomous Engine v2.0 siap.")
                  appendLog("[BRIDGE] WebView DOM Scraper & Auto-Clicker diaktifkan.")

                  setContentView(buildMainScreen())
                  loadMockSandbox1xBetPage()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isAutopilotRunning = false
                  uiHandler.removeCallbacksAndMessages(null)
                  try {
                      toneGen?.release()
                      aiExecutor.shutdownNow()
                  } catch (e: Exception) {}
              }

              private fun loadSettings() {
                  mirrorUrl = prefs.getString(KEY_MIRROR_URL, "https://1xbet.com/id/live/football") ?: "https://1xbet.com/id/live/football"
                  minConfidence = prefs.getInt(KEY_MIN_CONFIDENCE, 82).coerceIn(65, 98)
                  minOdds = prefs.getFloat(KEY_MIN_ODDS, 1.50f).toDouble()
                  maxOdds = prefs.getFloat(KEY_MAX_ODDS, 3.60f).toDouble()
                  baseStake = prefs.getLong(KEY_BASE_STAKE, 50000L)
                  stakeMode = prefs.getInt(KEY_STAKE_MODE, 1)
                  stopLossLimit = prefs.getLong(KEY_STOP_LOSS, 300000L)
                  takeProfitTarget = prefs.getLong(KEY_TAKE_PROFIT, 500000L)
                  humanDelayMs = prefs.getLong(KEY_HUMAN_DELAY, 2400L).coerceIn(1200L, 6000L)
                  geminiApiKey = prefs.getString(KEY_GEMINI_API, "") ?: ""
                  customOddsSelector = prefs.getString(KEY_CUSTOM_ODDS_SEL, customOddsSelector) ?: customOddsSelector
                  customStakeSelector = prefs.getString(KEY_CUSTOM_STAKE_SEL, customStakeSelector) ?: customStakeSelector
                  customBetBtnSelector = prefs.getString(KEY_CUSTOM_BETBTN_SEL, customBetBtnSelector) ?: customBetBtnSelector
                  currentBalance = prefs.getLong(KEY_BALANCE, 1500000L)
              }

              private fun saveSettings() {
                  prefs.edit()
                      .putString(KEY_MIRROR_URL, mirrorUrl)
                      .putInt(KEY_MIN_CONFIDENCE, minConfidence)
                      .putFloat(KEY_MIN_ODDS, minOdds.toFloat())
                      .putFloat(KEY_MAX_ODDS, maxOdds.toFloat())
                      .putLong(KEY_BASE_STAKE, baseStake)
                      .putInt(KEY_STAKE_MODE, stakeMode)
                      .putLong(KEY_STOP_LOSS, stopLossLimit)
                      .putLong(KEY_TAKE_PROFIT, takeProfitTarget)
                      .putLong(KEY_HUMAN_DELAY, humanDelayMs)
                      .putString(KEY_GEMINI_API, geminiApiKey)
                      .putString(KEY_CUSTOM_ODDS_SEL, customOddsSelector)
                      .putString(KEY_CUSTOM_STAKE_SEL, customStakeSelector)
                      .putString(KEY_CUSTOM_BETBTN_SEL, customBetBtnSelector)
                      .putLong(KEY_BALANCE, currentBalance)
                      .apply()
              }

              // =====================================================================
              // MASTER UI LAYOUT (TOP BAR + WEBVIEW + FLOATING AI OVERLAY)
              // =====================================================================
              @SuppressLint("SetJavaScriptEnabled")
              private fun buildMainScreen(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#070E1A"))
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }

                  // 1. TOP CONTROL BAR (1xBet Account & Master AI Autopilot Switch)
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0D1B30"))
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                  }

                  val row1 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val titleCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val appTitle = TextView(this).apply {
                      text = "⚡ 1xBet AI Auto-Bet & DOM Bridge"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#38BDF8"))
                  }
                  val statusSub = TextView(this).apply {
                      text = "🟢 DOM Scraper Ready | Min Conf: $minConfidence%"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      setTextColor(Color.parseColor("#94A3B8"))
                  }
                  topStatusTv = statusSub
                  titleCol.addView(appTitle)
                  titleCol.addView(statusSub)
                  row1.addView(titleCol)

                  // Master START / STOP AI AUTO-BET Button
                  val masterBtn = TextView(this).apply {
                      text = "▶️ START AI AUTO-BET"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      background = roundedBg("#00C853", "#69F0AE", 8)
                      setOnClickListener {
                          if (isAutopilotRunning) stopAutopilot() else startAutopilot()
                      }
                  }
                  masterToggleBtn = masterBtn
                  row1.addView(masterBtn)
                  topBar.addView(row1)

                  // Row 2: Saldo, Profit & Quick WebView Actions
                  val row2 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      lp.topMargin = dp(6)
                      layoutParams = lp
                  }

                  val balBadge = TextView(this).apply {
                      text = "Saldo: Rp ${formatRp(currentBalance)}"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                      background = roundedBg("#162944", "#264673", 6)
                  }
                  balanceTv = balBadge
                  row2.addView(balBadge)

                  val profBadge = TextView(this).apply {
                      text = "P/L: Rp 0"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#4ADE80"))
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                      background = roundedBg("#162944", "#264673", 6)
                      val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      lp.leftMargin = dp(6)
                      layoutParams = lp
                  }
                  profitTv = profBadge
                  row2.addView(profBadge)

                  val spacer = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, dp(1), 1f)
                  }
                  row2.addView(spacer)

                  // Button Buka Link 1xBet Asli
                  val btnRealUrl = TextView(this).apply {
                      text = "🌐 Web 1xBet"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                      background = roundedBg("#0284C7", "#38BDF8", 6)
                      setOnClickListener {
                          appendLog("[WEBVIEW] Membuka Mirror URL: $mirrorUrl")
                          webView?.loadUrl(mirrorUrl)
                      }
                  }
                  row2.addView(btnRealUrl)

                  // Button Mode Simulasi DOM 1xBet
                  val btnSandbox = TextView(this).apply {
                      text = "🧪 Simulasi DOM"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                      background = roundedBg("#6366F1", "#818CF8", 6)
                      val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      lp.leftMargin = dp(5)
                      layoutParams = lp
                      setOnClickListener {
                          appendLog("[SANDBOX] Memuat halaman simulasi 1xBet Live untuk tes Auto-Clicker...")
                          loadMockSandbox1xBetPage()
                      }
                  }
                  row2.addView(btnSandbox)

                  topBar.addView(row2)
                  root.addView(topBar)

                  // 2. MIDDLE AREA: LIVE 1xBET WEBVIEW DENGAN JS BRIDGE
                  val wv = WebView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.databaseEnabled = true
                      settings.loadsImagesAutomatically = true
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      settings.userAgentString =
                          "Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

                      val cookieManager = CookieManager.getInstance()
                      cookieManager.setAcceptCookie(true)
                      cookieManager.setAcceptThirdPartyCookies(this, true)

                      addJavascriptInterface(AndroidDOMBridge(), "AndroidBridge")

                      webViewClient = object : WebViewClient() {
                          override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                              return false
                          }

                          override fun onPageFinished(view: WebView?, url: String?) {
                              super.onPageFinished(view, url)
                              topStatusTv?.text = "🟢 Halaman Aktif: ${url?.take(38) ?: "1xBet"}..."
                          }
                      }
                      webChromeClient = WebChromeClient()
                  }
                  webView = wv
                  root.addView(wv)

                  // 3. BOTTOM AREA: FLOATING AI OVERLAY & NAVIGATION TABS
                  val bottomPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B1526"))
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(285)
                      )
                  }
                  bottomOverlayContainer = bottomPanel

                  // Tab Navigation Bar + Minimize Toggle
                  val navBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#11223D"))
                      setPadding(dp(8), dp(5), dp(8), dp(5))
                  }

                  val tabs = listOf(
                      "RADAR" to "🧠 Radar AI & Log",
                      "SLIPS" to "🎟️ Slip Auto-Bet",
                      "SETTINGS" to "⚙️ Mirror & Risiko"
                  )

                  tabs.forEach { (tabId, tabTitle) ->
                      val btn = TextView(this).apply {
                          text = tabTitle
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.WHITE)
                          setPadding(dp(10), dp(6), dp(10), dp(6))
                          val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                          lp.setMargins(dp(2), 0, dp(2), 0)
                          layoutParams = lp
                          gravity = Gravity.CENTER
                          setOnClickListener {
                              activeBottomTab = tabId
                              if (isPanelMinimized) toggleMinimizePanel()
                              renderActiveBottomTab()
                          }
                      }
                      navBar.addView(btn)
                  }

                  val minBtn = TextView(this).apply {
                      text = "🔽 Kecilkan"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#FBBF24"))
                      setPadding(dp(8), dp(6), dp(8), dp(6))
                      background = roundedBg("#1E293B", "#475569", 6)
                      setOnClickListener {
                          toggleMinimizePanel()
                          text = if (isPanelMinimized) "🔼 Buka AI" else "🔽 Kecilkan"
                      }
                  }
                  navBar.addView(minBtn)
                  bottomPanel.addView(navBar)

                  val contentFrame = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  }
                  dynamicTabContentContainer = contentFrame
                  bottomPanel.addView(contentFrame)

                  root.addView(bottomPanel)
                  renderActiveBottomTab()
                  updateHeaderBalanceUI()
                  return root
              }

              private fun toggleMinimizePanel() {
                  val panel = bottomOverlayContainer ?: return
                  isPanelMinimized = !isPanelMinimized
                  val targetHeight = if (isPanelMinimized) dp(42) else dp(285)
                  panel.layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      targetHeight
                  )
                  panel.requestLayout()
              }

              // =====================================================================
              // RENDER ISI TAB BAWAH (RADAR AI, SLIPS, SETTINGS)
              // =====================================================================
              private fun renderActiveBottomTab() {
                  val frame = dynamicTabContentContainer ?: return
                  frame.removeAllViews()
                  when (activeBottomTab) {
                      "RADAR" -> frame.addView(buildRadarAndTerminalTab())
                      "SLIPS" -> frame.addView(buildSlipsHistoryTab())
                      "SETTINGS" -> frame.addView(buildSettingsTab())
                  }
              }

              private fun buildRadarAndTerminalTab(): View {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }

                  // AI Live Decision Card
                  val decisionCard = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                      background = roundedBg("#13233E", "#0284C7", 8)
                      val lp = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                      lp.bottomMargin = dp(6)
                      layoutParams = lp
                  }

                  val summaryText = TextView(this).apply {
                      val d = latestAIDecision
                      text = if (d == null) {
                          "🤖 Otak AI Siap: Tekan 'START AI AUTO-BET' di kanan atas atau tombol 'Scan Sekali' untuk membedah pertandingan di layar 1xBet."
                      } else {
                          "🎯 TARGET AI: ${d.match.homeTeam} vs ${d.match.awayTeam}\n" +
                              "Pick: ${d.pickLabel} @ ${String.format(Locale.US, "%.2f", d.targetOdd)} | Conf: ${d.confidenceScore}% | Edge: +${String.format(Locale.US, "%.1f", d.valueEdgePercent)}% | Stake: Rp ${formatRp(d.recommendedStake)}"
                      }
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#E2E8F0"))
