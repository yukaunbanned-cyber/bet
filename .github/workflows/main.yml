              private fun appendLog(msg: String) {
                  val time = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  terminalLogs.add("[$time] $msg")
                  while (terminalLogs.size > 45) {
                      terminalLogs.removeAt(0)
                  }
                  terminalLogTv?.text = terminalLogs.joinToString("\n")
              }

              private fun updateHeaderBalanceUI() {
                  balanceTv?.text = "Saldo: Rp ${formatRp(currentBalance)}"
                  val sign = if (dailyNetProfit >= 0) "+" else "-"
                  profitTv?.text = "P/L: ${sign}Rp ${formatRp( kotlin.math.abs(dailyNetProfit) )}"
                  profitTv?.setTextColor(
                      if (dailyNetProfit >= 0) Color.parseColor("#4ADE80") else Color.parseColor("#F87171")
                  )
              }

              private fun formatRp(amount: Long): String {
                  return String.format(Locale.US, "%,d", amount).replace(',', '.')
              }

              private fun playBeep() {
                  try {
                      toneGen?.startTone(ToneGenerator.TONE_PROP_ACK, 90)
                  } catch (e: Exception) {}
              }

              private fun vibratePhone() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createOneShot(45L, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(45L)
                      }
                  } catch (e: Exception) {}
              }

              private fun roundedBg(fillHex: String, strokeHex: String, radiusDp: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = dp(radiusDp).toFloat()
                      setColor(Color.parseColor(fillHex))
                      setStroke(dp(1), Color.parseColor(strokeHex))
                  }
              }

              private fun dp(value: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value.toFloat(),
                      resources.displayMetrics
                  ).toInt()
              }
