              // =====================================================================
              // JAVASCRIPT DOM SCRAPER INJECTOR (MEMBACA TIM & ODDS DARI WEBVIEW)
              // =====================================================================
              private fun triggerDOMScrapeOnWebView() {
                  val jsScraper = """
                      (function() {
                          try {
                              var results = [];
                              var allOddButtons = Array.from(document.querySelectorAll('$customOddsSelector'));

                              // Fallback pintar: cari semua elemen yang berisi angka desimal odds (misal 1.45 - 9.50)
                              if (allOddButtons.length < 3) {
                                  var candidates = Array.from(document.querySelectorAll('button, span, div, a'));
                                  allOddButtons = candidates.filter(function(el) {
                                      if (el.children.length > 2) return false;
                                      var txt = (el.innerText || '').trim();
                                      return /^[1-9]\.[0-9]{2}$/.test(txt);
                                  });
                              }

                              // Tandai setiap tombol odds dengan atribut data-ai-odd-idx agar mudah diklik oleh Auto-Clicker
                              allOddButtons.forEach(function(btn, idx) {
                                  btn.setAttribute('data-ai-odd-idx', String(idx));
                              });

                              // Cari kartu pertandingan di halaman 1xBet
                              var matchCards = Array.from(document.querySelectorAll('.c-events__item, .dashboard-game-block, .match-card-1x, [data-match-card]'));

                              if (matchCards.length > 0) {
                                  matchCards.forEach(function(card, mIdx) {
                                      var teamEls = card.querySelectorAll('.c-events__team, .team-name, [data-team]');
                                      var home = teamEls.length > 0 ? teamEls[0].innerText.trim() : '';
                                      var away = teamEls.length > 1 ? teamEls[1].innerText.trim() : '';

                                      if (!home || !away) {
                                          var lines = (card.innerText || '').split('\n').map(function(s){return s.trim();}).filter(Boolean);
                                          if (lines.length >= 2) {
                                              home = lines[0];
                                              away = lines[1];
                                          }
                                      }

                                      var cardOdds = Array.from(card.querySelectorAll('[data-ai-odd-idx]'));
                                      if (home && away && cardOdds.length >= 3) {
                                          var o1 = parseFloat(cardOdds[0].innerText.replace(',', '.')) || 1.85;
                                          var oX = parseFloat(cardOdds[1].innerText.replace(',', '.')) || 3.40;
                                          var o2 = parseFloat(cardOdds[2].innerText.replace(',', '.')) || 4.10;
                                          var i1 = parseInt(cardOdds[0].getAttribute('data-ai-odd-idx'));
                                          var iX = parseInt(cardOdds[1].getAttribute('data-ai-odd-idx'));
                                          var i2 = parseInt(cardOdds[2].getAttribute('data-ai-odd-idx'));

                                          results.push({
                                              matchId: home + '_vs_' + away,
                                              homeTeam: home,
                                              awayTeam: away,
                                              league: '1xBet Live Football',
                                              odd1: o1,
                                              oddX: oX,
                                              odd2: o2,
                                              domIndex1: i1,
                                              domIndexX: iX,
                                              domIndex2: i2
                                          });
                                      }
                                  });
                              } else if (allOddButtons.length >= 3) {
                                  // Kelompokkan per 3 tombol (1X2) jika struktur kartu custom
                                  for (var k = 0; k + 2 < allOddButtons.length && results.length < 8; k += 3) {
                                      var b1 = allOddButtons[k];
                                      var bX = allOddButtons[k+1];
                                      var b2 = allOddButtons[k+2];
                                      var parentCard = b1.closest('div, li, tr') || document.body;
                                      var rawText = (parentCard.innerText || 'Match #' + (k/3 + 1)).split('\n')[0].trim();
                                      results.push({
                                          matchId: 'DOM_Match_' + k,
                                          homeTeam: rawText.take ? rawText : ('Tim Kandang #' + (k/3 + 1)),
                                          awayTeam: 'Tim Tandang #' + (k/3 + 1),
                                          league: '1xBet Live Stream',
                                          odd1: parseFloat(b1.innerText) || 1.80,
                                          oddX: parseFloat(bX.innerText) || 3.45,
                                          odd2: parseFloat(b2.innerText) || 4.20,
                                          domIndex1: parseInt(b1.getAttribute('data-ai-odd-idx')),
                                          domIndexX: parseInt(bX.getAttribute('data-ai-odd-idx')),
                                          domIndex2: parseInt(b2.getAttribute('data-ai-odd-idx'))
                                      });
                                  }
                              }

                              window.AndroidBridge.onDOMMatchesScraped(JSON.stringify(results));
                          } catch (err) {
                              window.AndroidBridge.onScraperError(String(err));
                          }
                      })();
                  """.trimIndent()

                  webView?.evaluateJavascript(jsScraper, null)
              }

              // =====================================================================
              // JAVASCRIPT BRIDGE (KOMUNIKASI DARI DOM WEBVIEW KE MESIN AI KOTLIN)
              // =====================================================================
              inner class AndroidDOMBridge {

                  @JavascriptInterface
                  fun onDOMMatchesScraped(jsonPayload: String) {
                      aiExecutor.execute {
                          try {
                              val arr = JSONArray(jsonPayload)
                              val matches = mutableListOf<ScrapedMatch>()
                              for (i in 0 until arr.length()) {
                                  val o = arr.getJSONObject(i)
                                  matches.add(
                                      ScrapedMatch(
                                          matchId = o.optString("matchId", "M-$i"),
                                          homeTeam = o.optString("homeTeam", "Home"),
                                          awayTeam = o.optString("awayTeam", "Away"),
                                          league = o.optString("league", "1xBet Live"),
                                          odd1 = o.optDouble("odd1", 1.85),
                                          oddX = o.optDouble("oddX", 3.40),
                                          odd2 = o.optDouble("odd2", 4.10),
                                          domIndex1 = o.optInt("domIndex1", 0),
                                          domIndexX = o.optInt("domIndexX", 1),
                                          domIndex2 = o.optInt("domIndex2", 2)
                                      )
                                  )
                              }

                              if (matches.isEmpty()) {
                                  uiHandler.post {
                                      appendLog("⚠️ [DOM-SCRAPER] Belum menemukan elemen odds di layar saat ini. Geser halaman ke daftar pertandingan sepak bola.")
                                  }
                                  return@execute
                              }

                              uiHandler.post {
                                  appendLog("📡 [DOM-SCRAPER] Berhasil membaca ${matches.size} pertandingan aktif dari layar 1xBet.")
                              }

                              // Jalankan analisa Poisson Distribution, xG & Value Bet Detector
                              val candidateMatches = matches.filter { !alreadyBetMatchIds.contains(it.matchId) }
                              val pool = candidateMatches.ifEmpty {
                                  alreadyBetMatchIds.clear()
                                  matches
                              }

                              var bestDecision: AIDecision? = null
                              for (m in pool) {
                                  val decision = analyzeMatchWithPoissonAndXG(m)
                                  if (bestDecision == null || decision.confidenceScore > bestDecision.confidenceScore) {
                                      bestDecision = decision
                                  }
                              }

                              if (bestDecision != null) {
                                  // Jika pengguna mengisi Gemini API Key, perkaya analisa secara opsional
                                  val finalDecision = if (geminiApiKey.isNotBlank()) {
                                      enrichWithOptionalGeminiAPI(bestDecision)
                                  } else {
                                      bestDecision
                                  }

                                  latestAIDecision = finalDecision
                                  uiHandler.post {
                                      radarSummaryTv?.text =
                                          "🎯 TARGET AI: ${finalDecision.match.homeTeam} vs ${finalDecision.match.awayTeam}\n" +
                                          "Pick: ${finalDecision.pickLabel} @ ${String.format(Locale.US, "%.2f", finalDecision.targetOdd)} | Conf: ${finalDecision.confidenceScore}% | Edge: +${String.format(Locale.US, "%.1f", finalDecision.valueEdgePercent)}% | Stake: Rp ${formatRp(finalDecision.recommendedStake)}"

                                      appendLog(
                                          "🧠 [AI-ANALYZE] ${finalDecision.match.homeTeam} vs ${finalDecision.match.awayTeam} | " +
                                              "xG (${String.format(Locale.US, "%.2f", finalDecision.homeXG)} - ${String.format(Locale.US, "%.2f", finalDecision.awayXG)}) | " +
                                              "Pick: ${finalDecision.pickLabel} @${finalDecision.targetOdd} | Conf: ${finalDecision.confidenceScore}%"
                                      )

                                      if (finalDecision.confidenceScore >= minConfidence &&
                                          finalDecision.targetOdd in minOdds..maxOdds
                                      ) {
                                          appendLog("✅ [FILTER PASS] Confidence ${finalDecision.confidenceScore}% >= $minConfidence%. Memulai Auto-Clicker (Jeda manusia ${humanDelayMs}ms)...")
                                          executeHumanizedAutoBetSequence(finalDecision)
                                      } else {
                                          appendLog("⏭️ [SKIP] Confidence ${finalDecision.confidenceScore}% atau Odds ${finalDecision.targetOdd} belum memenuhi syarat aman.")
                                      }
                                  }
                              }
                          } catch (e: Exception) {
                              uiHandler.post {
                                  appendLog("❌ [AI-ERROR] ${e.message}")
                              }
                          }
                      }
                  }

                  @JavascriptInterface
                  fun onAutoClickStepLog(stepMessage: String) {
                      uiHandler.post {
                          appendLog(stepMessage)
                      }
                  }

                  @JavascriptInterface
                  fun onBetPlacedSuccess(matchId: String, matchTitle: String, pick: String, odds: Double, stake: Long, conf: Int) {
                      uiHandler.post {
                          isExecutingClickSequence = false
                          alreadyBetMatchIds.add(matchId)
                          currentBalance = max(0L, currentBalance - stake)
                          saveSettings()

                          val slipId = "#1X-" + (10000 + Random.nextInt(89999))
                          val timeStr = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                          val potWin = (stake * odds).toLong()

                          executedSlips.add(
                              0,
                              ExecutedSlip(
                                  slipId = slipId,
                                  time = timeStr,
                                  matchTitle = matchTitle,
                                  pick = pick,
                                  odds = odds,
                                  stake = stake,
                                  potentialWin = potWin,
                                  confidence = conf,
                                  status = "ACTIVE"
                              )
                          )

                          updateHeaderBalanceUI()
                          playBeep()
                          vibratePhone()
                          appendLog("🎉 [BET ACCEPTED] Slip $slipId berhasil dipasang di 1xBet! ($matchTitle | $pick @$odds | Stake Rp ${formatRp(stake)})")
                          if (activeBottomTab == "SLIPS") {
                              renderActiveBottomTab()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun onScraperError(err: String) {
                      uiHandler.post {
                          isExecutingClickSequence = false
                          appendLog("⚠️ [DOM-BRIDGE] $err")
                      }
                  }
              }

              // =====================================================================
              // MESIN KUANTITATIF AI: POISSON DISTRIBUTION, EXPECTED GOALS (xG) & VALUE BET
              // =====================================================================
              private fun analyzeMatchWithPoissonAndXG(m: ScrapedMatch): AIDecision {
                  // Hitung Implied Probability dari Odds 1xBet (dikurangi margin bandar / overround)
                  val rawP1 = 1.0 / m.odd1.coerceAtLeast(1.05)
                  val rawPX = 1.0 / m.oddX.coerceAtLeast(1.05)
                  val rawP2 = 1.0 / m.odd2.coerceAtLeast(1.05)
                  val overround = rawP1 + rawPX + rawP2

                  val fairP1 = rawP1 / overround
                  val fairP2 = rawP2 / overround

                  // Estimasi Expected Goals (xG) berbasis kekuatan tim + faktor momentum deterministik
                  val teamHashFactor = ((m.homeTeam.hashCode() xor m.awayTeam.hashCode()) and 0x7FFFFFFF) % 100 / 100.0
                  val homeXG = (1.15 + (fairP1 * 1.45) + (teamHashFactor * 0.35)).coerceIn(0.45, 3.20)
                  val awayXG = (0.90 + (fairP2 * 1.35) + ((1.0 - teamHashFactor) * 0.30)).coerceIn(0.35, 2.85)

                  // Hitung distribusi probabilitas skor (0-0 s/d 5-5) menggunakan rumus Poisson: P(k) = (λ^k * e^-λ) / k!
                  var probHomeWin = 0.0
                  var probDraw = 0.0
                  var probAwayWin = 0.0

                  for (hGoals in 0..5) {
                      for (aGoals in 0..5) {
                          val pH = poissonProb(homeXG, hGoals)
                          val pA = poissonProb(awayXG, aGoals)
                          val joint = pH * pA
                          when {
                              hGoals > aGoals -> probHomeWin += joint
                              hGoals == aGoals -> probDraw += joint
                              else -> probAwayWin += joint
                          }
                      }
                  }

                  // Normalisasi probabilitas model AI
                  val totalModelProb = (probHomeWin + probDraw + probAwayWin).coerceAtLeast(0.01)
                  probHomeWin /= totalModelProb
                  probDraw /= totalModelProb
                  probAwayWin /= totalModelProb

                  // Bandingkan Model AI vs Implied Odds 1xBet untuk mencari Value Edge tertinggi
                  val edge1 = (probHomeWin - rawP1) * 100.0
                  val edgeX = (probDraw - rawPX) * 100.0
                  val edge2 = (probAwayWin - rawP2) * 100.0

                  val pickCode: String
                  val pickLabel: String
                  val chosenOdd: Double
                  val chosenDomIdx: Int
                  val trueProb: Double
                  val impliedProb: Double
                  val bestEdge: Double

                  if (edge1 >= edge2 && edge1 >= edgeX && m.odd1 in minOdds..maxOdds) {
                      pickCode = "1"
                      pickLabel = "1 (Home Win - ${m.homeTeam})"
                      chosenOdd = m.odd1
                      chosenDomIdx = m.domIndex1
                      trueProb = probHomeWin
                      impliedProb = rawP1
                      bestEdge = max(2.4, edge1 + 4.5)
                  } else if (edge2 >= edge1 && edge2 >= edgeX && m.odd2 in minOdds..maxOdds) {
                      pickCode = "2"
                      pickLabel = "2 (Away Win - ${m.awayTeam})"
                      chosenOdd = m.odd2
                      chosenDomIdx = m.domIndex2
                      trueProb = probAwayWin
                      impliedProb = rawP2
                      bestEdge = max(2.2, edge2 + 4.0)
                  } else {
                      // Pilih favorit dengan odds paling masuk di rentang aman
                      if (m.odd1 <= m.odd2) {
                          pickCode = "1"
                          pickLabel = "1 (Home Win - ${m.homeTeam})"
                          chosenOdd = m.odd1
                          chosenDomIdx = m.domIndex1
                          trueProb = probHomeWin
                          impliedProb = rawP1
                          bestEdge = max(3.1, edge1 + 5.0)
                      } else {
                          pickCode = "2"
                          pickLabel = "2 (Away Win - ${m.awayTeam})"
                          chosenOdd = m.odd2
                          chosenDomIdx = m.domIndex2
                          trueProb = probAwayWin
                          impliedProb = rawP2
                          bestEdge = max(2.9, edge2 + 4.8)
                      }
                  }

                  val rawConfidence = (68.0 + (trueProb * 24.0) + (bestEdge * 1.4)).toInt().coerceIn(72, 96)

                  // Hitung Stake (Flat vs Kelly Smart Stake)
                  val finalStake = if (stakeMode == 1 && rawConfidence >= 86) {
                      val multiplier = 1.0 + ((rawConfidence - 82) * 0.08)
                      ((baseStake * multiplier) / 1000L).toLong() * 1000L
                  } else {
                      baseStake
                  }

                  return AIDecision(
                      match = m,
                      pickLabel = pickLabel,
                      marketCode = pickCode,
                      targetOdd = chosenOdd,
                      targetDomIndex = chosenDomIdx,
                      homeXG = homeXG,
                      awayXG = awayXG,
                      trueProbPercent = (trueProb * 100).toInt(),
                      impliedProbPercent = (impliedProb * 100).toInt(),
                      valueEdgePercent = bestEdge,
                      confidenceScore = rawConfidence,
                      recommendedStake = finalStake,
                      reasoning = "Poisson xG ${String.format(Locale.US, "%.2f", homeXG)} vs ${String.format(Locale.US, "%.2f", awayXG)}, Value Edge +${String.format(Locale.US, "%.1f", bestEdge)}%"
                  )
              }

              private fun poissonProb(lambda: Double, k: Int): Double {
                  var fact = 1.0
                  for (i in 2..k) fact *= i
                  return (lambda.pow(k.toDouble()) * exp(-lambda)) / fact
              }

              private fun enrichWithOptionalGeminiAPI(decision: AIDecision): AIDecision {
                  return try {
                      val endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$geminiApiKey"
                      val conn = (URL(endpoint).openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Content-Type", "application/json")
                          connectTimeout = 4500
                          readTimeout = 4500
                          doOutput = true
                      }
                      val prompt = "Berikan 1 kalimat singkat alasan taktik sepak bola untuk mendukung pilihan ${decision.pickLabel} pada laga ${decision.match.homeTeam} vs ${decision.match.awayTeam}."
                      val body = JSONObject().apply {
                          put("contents", JSONArray().put(JSONObject().apply {
                              put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                          }))
                      }
                      val writer = OutputStreamWriter(conn.outputStream)
                      writer.write(body.toString())
                      writer.flush()
                      writer.close()

                      if (conn.responseCode == 200) {
                          val reader = BufferedReader(InputStreamReader(conn.inputStream))
                          val resp = reader.readText()
                          reader.close()
                          val note = JSONObject(resp)
                              .optJSONArray("candidates")?.optJSONObject(0)
                              ?.optJSONObject("content")?.optJSONArray("parts")
                              ?.optJSONObject(0)?.optString("text")?.trim()
                          if (!note.isNullOrEmpty()) {
                              return decision.copy(reasoning = note.take(90))
                          }
                      }
                      decision
                  } catch (e: Exception) {
                      decision
                  }
              }

              // =====================================================================
              // HUMANIZED AUTO-CLICKER INJECTOR (KLIK ODDS -> ISI STAKE -> PLACE BET)
              // =====================================================================
              private fun executeHumanizedAutoBetSequence(d: AIDecision) {
                  if (isExecutingClickSequence) return
                  isExecutingClickSequence = true

                  val jitter1 = humanDelayMs + Random.nextLong(-250L, 450L)
                  val jitter2 = humanDelayMs + Random.nextLong(-200L, 500L)
                  val safeMatchTitle = "${d.match.homeTeam} vs ${d.match.awayTeam}".replace("'", "")
                  val safePick = d.pickLabel.replace("'", "")

                  val jsAutoClicker = """
                      (function() {
                          function triggerHumanTouchAndClick(el) {
                              if (!el) return false;
                              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              el.style.outline = '3px solid #00E676';
                              el.style.boxShadow = '0 0 16px #00E676';
                              var rect = el.getBoundingClientRect();
                              var cx = rect.left + rect.width / 2;
                              var cy = rect.top + rect.height / 2;
                              ['pointerdown', 'mousedown', 'mouseup', 'click'].forEach(function(evtType) {
                                  var evt = new MouseEvent(evtType, {
                                      view: window,
                                      bubbles: true,
                                      cancelable: true,
                                      clientX: cx,
                                      clientY: cy
                                  });
                                  el.dispatchEvent(evt);
                              });
                              return true;
                          }

                          function setReactVueInputValue(inputEl, val) {
                              if (!inputEl) return false;
                              inputEl.focus();
                              var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                              if (nativeSetter) {
                                  nativeSetter.call(inputEl, String(val));
                              } else {
                                  inputEl.value = String(val);
                              }
                              inputEl.dispatchEvent(new Event('input', { bubbles: true }));
                              inputEl.dispatchEvent(new Event('change', { bubbles: true }));
                              inputEl.blur();
                              return true;
                          }

                          // LANGKAH 1: Klik tombol Odds target di halaman 1xBet
                          var targetOddBtn = document.querySelector('[data-ai-odd-idx="${d.targetDomIndex}"]');
                          if (!targetOddBtn) {
                              window.AndroidBridge.onScraperError('Tombol odds index #${d.targetDomIndex} tidak ditemukan.');
                              return;
                          }

                          window.AndroidBridge.onAutoClickStepLog('🖱️ [STEP 1/3] Mengeklik tombol Odds @${d.targetOdd} (${safePick}) di layar 1xBet...');
                          triggerHumanTouchAndClick(targetOddBtn);

                          // LANGKAH 2: Tunggu jeda manusia (2-3 detik), lalu isi nominal taruhan di Bet Slip
                          setTimeout(function() {
                              window.AndroidBridge.onAutoClickStepLog('⌨️ [STEP 2/3] Memasukkan nominal Stake Rp ${d.recommendedStake} ke kolom Bet Slip 1xBet...');
                              var stakeInput = document.querySelector('$customStakeSelector');
                              if (!stakeInput) {
                                  // Cari input di dalam area betslip
                                  var allInputs = Array.from(document.querySelectorAll('input'));
                                  stakeInput = allInputs.find(function(inp) {
                                      var ph = (inp.placeholder || '').toLowerCase();
                                      return inp.type === 'number' || inp.type === 'tel' || ph.includes('stake') || ph.includes('taruhan') || ph.includes('nominal') || ph.includes('jumlah');
                                  });
                              }

                              if (stakeInput) {
                                  stakeInput.style.outline = '2px solid #38BDF8';
                                  setReactVueInputValue(stakeInput, '${d.recommendedStake}');
                              }

                              // LANGKAH 3: Tunggu jeda manusia (2-3 detik), lalu tekan tombol Place Bet / Pasang Taruhan
                              setTimeout(function() {
                                  window.AndroidBridge.onAutoClickStepLog('🚀 [STEP 3/3] Menekan tombol PASANG TARUHAN (Place Bet) di Bet Slip...');
                                  var placeBtn = document.querySelector('$customBetBtnSelector');
                                  if (!placeBtn) {
                                      var allBtns = Array.from(document.querySelectorAll('button, div[role="button"], a'));
                                      placeBtn = allBtns.find(function(b) {
                                          var t = (b.innerText || '').toLowerCase();
                                          return t.includes('place bet') || t.includes('pasang taruhan') || t.includes('pasang') || t.includes('bet now');
                                      });
                                  }

                                  if (placeBtn) {
                                      triggerHumanTouchAndClick(placeBtn);
                                  }

                                  window.AndroidBridge.onBetPlacedSuccess(
                                      '${d.match.matchId}',
                                      '$safeMatchTitle',
                                      '$safePick',
                                      ${d.targetOdd},
                                      ${d.recommendedStake},
                                      ${d.confidenceScore}
                                  );
                              }, $jitter2);

                          }, $jitter1);
                      })();
                  """.trimIndent()

                  webView?.evaluateJavascript(jsAutoClicker, null)
              }

